# ═══════════════════════════════════════════════════════════
# Mentenaz Forge — Release Builder
# Lives in: mentenaz/forge-landing-page (public)
# Job: Build all platforms + publish release
# Cost: ZERO — public repo = unlimited minutes
# ═══════════════════════════════════════════════════════════

name: Build and Release Forge

on:
  # Triggered by forge private repo via repository_dispatch
  repository_dispatch:
    types: [new-release]

  # Also allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.1)'
        required: true
      tag:
        description: 'Git tag (e.g. v0.1.1)'
        required: true

jobs:

  # ═══════════════════════════════════════════════════════
  # BUILD WINDOWS — NSIS installer
  # ═══════════════════════════════════════════════════════
  build-windows:
    name: Build — Windows
    runs-on: windows-latest

    steps:
      - name: Get build info
        id: info
        run: |
          echo "VERSION=${{ github.event.client_payload.version || inputs.version }}" >> $GITHUB_OUTPUT
          echo "TAG=${{ github.event.client_payload.tag || inputs.tag }}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout Forge source (private repo)
        uses: actions/checkout@v4
        with:
          repository: mentenaz/forge
          token: ${{ secrets.FORGE_RELEASE_TOKEN }}
          path: forge-source
          ref: ${{ steps.info.outputs.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: forge-source/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: forge-source/src-tauri
          shared-key: forge-windows

      - name: Install frontend dependencies
        working-directory: forge-source
        run: npm ci

      - name: Build NSIS installer
        working-directory: forge-source
        run: npm run tauri build -- --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: forge-source/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  # ═══════════════════════════════════════════════════════
  # BUILD LINUX — deb, rpm, AppImage
  # ═══════════════════════════════════════════════════════
  build-linux:
    name: Build — Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Get build info
        id: info
        run: |
          echo "VERSION=${{ github.event.client_payload.version || inputs.version }}" >> $GITHUB_OUTPUT
          echo "TAG=${{ github.event.client_payload.tag || inputs.tag }}" >> $GITHUB_OUTPUT

      - name: Checkout Forge source (private repo)
        uses: actions/checkout@v4
        with:
          repository: mentenaz/forge
          token: ${{ secrets.FORGE_RELEASE_TOKEN }}
          path: forge-source
          ref: ${{ steps.info.outputs.TAG }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            build-essential \
            patchelf \
            libfuse2 \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: forge-source/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: forge-source/src-tauri
          shared-key: forge-linux

      - name: Install frontend dependencies
        working-directory: forge-source
        run: npm ci

      - name: Build deb and rpm
        working-directory: forge-source
        run: npm run tauri build -- --bundles deb,rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AppImage
        working-directory: forge-source
        run: npm run tauri build -- --bundles appimage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            forge-source/src-tauri/target/release/bundle/deb/*.deb
            forge-source/src-tauri/target/release/bundle/rpm/*.rpm
            forge-source/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 1

  # ═══════════════════════════════════════════════════════
  # PUBLISH RELEASE — to forge-landing-page
  # ═══════════════════════════════════════════════════════
  publish-release:
    name: Publish Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: always() && needs.build-windows.result == 'success'

    steps:
      - name: Get build info
        id: info
        run: |
          echo "VERSION=${{ github.event.client_payload.version || inputs.version }}" >> $GITHUB_OUTPUT
          echo "TAG=${{ github.event.client_payload.tag || inputs.tag }}" >> $GITHUB_OUTPUT

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: artifacts/linux
        continue-on-error: true

      - name: List all artifacts
        run: find artifacts/ -type f

      - name: Create and publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.TAG }}
          name: Mentenaz Forge v${{ steps.info.outputs.VERSION }}
          draft: false
          prerelease: true
          body: |
            ## Mentenaz Forge v${{ steps.info.outputs.VERSION }}

            The developer cockpit that connects everything.

            ### What's included
            - Multi-language LSP (TypeScript, C#, Razor, Rust, Deno, Python)
            - Multi-database workbench (SQLite, PostgreSQL, MySQL, MSSQL)
            - Full GitHub desktop client (Helm — 9 tabs)
            - AI Twin with 5-provider fallback
            - GitOps with AI commit messages
            - Full PTY terminal
            - System monitor (Cockpit)
            - Task Chain builder
            - Process manager
            - Extension system

            ### Downloads
            | Platform | File |
            |---|---|
            | Windows 10/11 x64 | `Mentenaz.Forge_${{ steps.info.outputs.VERSION }}_x64-setup.exe` |
            | Ubuntu / Debian | `Mentenaz.Forge_${{ steps.info.outputs.VERSION }}_amd64.deb` |
            | Fedora / RHEL | `Mentenaz.Forge_${{ steps.info.outputs.VERSION }}-1.x86_64.rpm` |
            | Universal Linux | `Mentenaz.Forge_${{ steps.info.outputs.VERSION }}_amd64.AppImage` |

            ### Requirements
            - Git
            - GitHub CLI (`gh`) — for GitOps and Helm
            - Node.js 18+ — for TypeScript LSP and Node panel
            - .NET SDK 8+ (optional) — for C# LSP

            ### First launch
            The Initializer panel detects missing tools and guides you through setup.

            ---
            [Documentation](https://forge.mentenaz-server.com) · [Report an issue](https://github.com/mentenaz/forge-landing-page/issues)
          files: |
            artifacts/windows/*.exe
            artifacts/linux/**/*.deb
            artifacts/linux/**/*.rpm
            artifacts/linux/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════
  # NOTIFY SUPABASE — via webhook (fires automatically)
  # ═══════════════════════════════════════════════════════
  # No extra step needed here.
  # GitHub fires the webhook to forge.mentenaz-server.com
  # automatically when the release is published above.
  # The Next.js /api/github-webhook route handles the rest.
